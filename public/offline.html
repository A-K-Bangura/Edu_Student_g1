<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - EduLift Sierra</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #3a86ff 0%, #8338ec 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        text-align: center;
        background: white;
        padding: 40px;
        border-radius: 20px;
        max-width: 500px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      .icon {
        font-size: 80px;
        margin-bottom: 20px;
      }
      h1 {
        color: #1f2937;
        margin-bottom: 10px;
        font-size: 32px;
      }
      p {
        color: #6b7280;
        line-height: 1.6;
        margin-bottom: 30px;
      }
      .btn {
        background: linear-gradient(135deg, #3a86ff 0%, #8338ec 100%);
        color: white;
        padding: 12px 32px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
      }
      .btn:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>You're Offline</h1>
      <p>
        It looks like you're not connected to the internet. Please check your
        connection and try again.
      </p>
      <button class="btn" onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
